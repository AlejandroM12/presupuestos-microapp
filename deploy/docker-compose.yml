# Producción de AtajoLab Presupuestos.
# Uso: copiar esta carpeta al servidor, crear `.env` a partir de `.env.production.example`
# y ejecutar `./scripts/deploy.sh <tag>`. No publica puertos: solo se accede desde la red
# del reverse proxy existente.
name: presupuestos

services:
  app:
    image: ghcr.io/alejandrom12/presupuestos-microapp:${TAG:-latest}
    container_name: presupuestos-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    networks: [internal, proxy]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 640m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Aplica las migraciones pendientes y termina. Se ejecuta antes de levantar la app.
  migrate:
    image: ghcr.io/alejandrom12/presupuestos-microapp-migrate:${TAG:-latest}
    profiles: ["migrate"]
    env_file: .env
    networks: [internal]
    restart: "no"

  # Opcional: PostgreSQL propio y aislado. Omitir si se usa una instancia existente
  # (con base de datos y usuario dedicados) y apuntar DATABASE_URL a ella.
  db:
    image: postgres:17-alpine
    profiles: ["own-db"]
    container_name: presupuestos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-presupuestos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-presupuestos}
    volumes:
      - presupuestos_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-presupuestos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal: {}
  proxy:
    # Red compartida con el reverse proxy ya existente (Caddy). Ajustar el nombre real.
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  presupuestos_pgdata: {}
